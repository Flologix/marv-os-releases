name: Bug report
description: Something broke or behaved wrongly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: From Settings › About, or `marv --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version (e.g. Ubuntu 24.04, Arch)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: "Please don't paste API keys, tokens or private code."
